# Postgres para desarrollo local: `podman compose up -d` o `docker compose up -d`
services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: naturalland
      POSTGRES_PASSWORD: naturalland
      POSTGRES_DB: naturalland
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
