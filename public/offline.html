<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06140c" />
    <title>Sin conexión · Anthony Jimenez Wildlife</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #06140c;
        color: #f4f7ef;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      img { width: 96px; height: 96px; border-radius: 20px; }
      h1 { margin: 24px 0 8px; font-size: 1.5rem; }
      p { margin: 4px 0; color: rgba(244, 247, 239, 0.7); }
      button {
        margin-top: 24px;
        padding: 10px 24px;
        border: 0;
        border-radius: 999px;
        background: #96c020;
        color: #06140c;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>Revisá tu conexión a internet e intentá de nuevo.</p>
      <p lang="en">You're offline. Check your connection and try again.</p>
      <button type="button" id="retry">Reintentar · Retry</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => location.reload());
    </script>
  </body>
</html>
